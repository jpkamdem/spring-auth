name: spring-server

services:
  postgres:
    image: postgres:17.5-alpine
    ports:
      - '5432:5432'
    networks:
      - network
    environment:
      POSTGRES_DB: spring-server_db
      POSTGRES_USER: kaiser
      POSTGRES_PASSWORD: kaisergoat
      DATABASE_URL: jdbc:postgresql://127.0.0.1/spring-server_db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kaiser -d spring-server_db']
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - db_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:2025-06-27-1
    ports:
      - '5050:80'
    networks:
      - network
    environment:
      PGADMIN_DEFAULT_EMAIL: michealkaiser@munchen.com
      PGADMIN_DEFAULT_PASSWORD: kaisergoat
    healthcheck:
      test: ['CMD', 'wget', '-O', '-', 'http://localhost:80/misc/ping']
      interval: 10s
      timeout: 10s
      start_period: 160s
      retries: 3
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
        required: true

volumes:
  db_data:
  pgadmin_data:
networks:
  network:
    driver: bridge
